name: Publish

on:
  push:
    branches:
      - main
  schedule:
    # refresh the content snapshot (GitHub, INSPIRE, talks) every two weeks
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Install pnpm 💨
        uses: pnpm/action-setup@v4
      - name: Install Node.js 🪅
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies 🛍️
        run: pnpm install --frozen-lockfile
      - name: Refresh content snapshot 🔄
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm data
      - name: Check 🔍
        run: pnpm check
      - name: Build 🔨
        run: pnpm build
      - name: Upload Pages artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
